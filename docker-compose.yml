version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: musicvideo_db
    environment:
      POSTGRES_DB: musicvideo_db
      POSTGRES_USER: musicvideo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - musicvideo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicvideo_user -d musicvideo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: musicvideo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - musicvideo_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: musicvideo_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://musicvideo_user:${DB_PASSWORD:-securepassword123}@db:5432/musicvideo_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DEBUG: "false"
    volumes:
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
      - temp_data:/app/temp
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - musicvideo_network
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: musicvideo_celery
    command: celery -A app.celery_app worker -l info -Q default --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://musicvideo_user:${DB_PASSWORD:-securepassword123}@db:5432/musicvideo_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
    volumes:
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
      - temp_data:/app/temp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - musicvideo_network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: musicvideo_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - musicvideo_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  outputs_data:
  temp_data:

networks:
  musicvideo_network:
    driver: bridge
